name: build

# Upstream builds the released .exe by hand on a developer machine, so nobody
# can check that the binary matches the source. This workflow builds it in the
# open, for every supported platform, and signs a provenance attestation, so a
# download can be verified with:
#   gh attestation verify <file>.zip --repo <owner>/<repo>

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # One platform failing should not hide the results for the others.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-15-intel
            experimental: true

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # Nuitka's tk-inter plugin needs the Tk headers and libraries present.
      # Ghostscript is deliberately NOT installed here: it is compiled from the
      # pinned Artifex source and bundled, so leaving the system one out is what
      # makes the smoke test prove that our own build actually works.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-tk tk-dev pngquant jpegoptim patchelf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # qpdf is for pikepdf: it publishes no x86_64 macOS wheel, so pip has to
        # build it from source there and needs the qpdf headers.
        run: brew install pngquant jpegoptim qpdf || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt -r requirements-build.txt

      - name: Fetch and verify bundled binaries
        # Fails the build if any download does not match tools/deps.lock.json
        run: python tools/fetch_deps.py --platform ${{ matrix.platform }}

      - name: Build standalone folder
        run: python build.py --skip-deps

      - name: Smoke test the pipelines
        run: python tools/smoke_test.py

      - name: Ensure Inno Setup is present
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        if: runner.os != 'macOS'
        run: python tools/package.py

      # Install the package for real rather than trusting that it built.
      - name: Check the .deb installs
        if: runner.os == 'Linux'
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          sudo dpkg -i "$deb"
          test -x /opt/minimalpdf-compress/MinimalPDF_Compress
          command -v minimalpdf-compress
          test -f /usr/share/applications/minimalpdf-compress.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/minimalpdf-compress.png
          sudo dpkg -r minimalpdf-compress
          echo "install, launcher, menu entry and icon all present"

      - name: List what was built
        shell: bash
        run: ls -la dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Attest installer provenance
        if: runner.os != 'macOS'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.os == 'Windows' && 'dist/*setup.exe' || 'dist/*.deb' }}

      - uses: actions/upload-artifact@v7
        with:
          name: MinimalPDF_Compress-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/*.deb
          if-no-files-found: error

  # One job, after every platform has built, so the release is created once
  # with all five archives. Doing it inside the matrix had five jobs racing to
  # create the same release. This is also the only job that needs write access.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*setup.exe
            artifacts/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
