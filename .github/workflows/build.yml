name: build

# Upstream builds the released .exe by hand on a developer machine, so nobody
# can check that the binary matches the source. This workflow builds it in the
# open, for every supported platform, and signs a provenance attestation, so a
# download can be verified with:
#   gh attestation verify <file>.zip --repo <owner>/<repo>

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # One platform failing should not hide the results for the others.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-15-intel
            experimental: true

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # Nuitka's tk-inter plugin needs the Tk headers and libraries present.
      # Ghostscript is a runtime dependency the end user supplies on these
      # platforms; it is installed here only so the build can smoke-test.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk tk-dev ghostscript pngquant jpegoptim patchelf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # qpdf is for pikepdf: it publishes no x86_64 macOS wheel, so pip has to
        # build it from source there and needs the qpdf headers.
        run: brew install ghostscript pngquant jpegoptim qpdf || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt -r requirements-build.txt

      - name: Fetch and verify bundled binaries
        # Fails the build if any download does not match tools/deps.lock.json
        run: python tools/fetch_deps.py --platform ${{ matrix.platform }}

      - name: Build standalone folder
        run: python build.py --skip-deps

      - name: Smoke test the pipelines
        run: python tools/smoke_test.py

      - name: List what was built
        shell: bash
        run: ls -la dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MinimalPDF_Compress-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
